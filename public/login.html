cat > ~/mobile-repair-website/public/login.html << 'EOF'
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login</title>
<style>
body{font-family:sans-serif;background:#f2f2f2;display:flex;justify-content:center;align-items:center;height:100vh;margin:0}
.box{background:white;padding:25px;border-radius:10px;box-shadow:0 0 10px #ccc;width:300px}
input{width:100%;padding:10px;margin:8px 0;box-sizing:border-box}
button{width:100%;padding:10px;background:#007bff;color:white;border:none;border-radius:5px;cursor:pointer}
</style>
</head>
<body>
<div class="box">
<h3>Admin Login</h3>
<input type="text" id="username" placeholder="Username - admin">
<input type="password" id="password" placeholder="Password">
<button onclick="doLogin()">Login</button>
<p id="msg" style="color:red"></p>
</div>
<script>
async function doLogin(){
  const username = document.getElementById('username').value;
  const password = document.getElementById('password').value;
  document.getElementById('msg').innerText = "Checking...";
  try{
    const res = await fetch('/login', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({username, password})
    });
    const data = await res.json();
    if(data.success){
      window.location.href = '/admin';
    } else {
      document.getElementById('msg').innerText = "Galat password Sir!";
    }
  } catch(e){
    document.getElementById('msg').innerText = "Server band hai, node server.js chalao";
  }
}
</script>
</body>
</html>
EOF
